<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przegląd strojów</title>
<style>
  body { margin: 0; padding: 12px; background: #2a1f3d; color: #f3ecff; font: 13px system-ui, sans-serif; }
  header { position: sticky; top: 0; background: #2a1f3d; padding: 6px 0 10px; z-index: 2; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .row { display: flex; gap: 6px; align-items: flex-end; padding: 6px 0; border-top: 1px solid #3b2a5c; }
  .row.bad .name { color: #ff8fa3; }
  .name { width: 150px; flex: 0 0 150px; font-size: 12px; word-break: break-all; }
  .name small { display: block; color: #c9b9e8; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 10px; color: #c9b9e8; }
  canvas { image-rendering: pixelated; background: #cdb8f0; display: block; }
  #summary { color: #ffd34d; }
</style>
</head>
<body>
<header>
  <strong>Przegląd strojów</strong>
  <span>czerwony — przeciek (przemalowana skóra, włosy, rekwizyt), turkus — brak (nieprzemalowane ubranie)</span>
  <label><input type="checkbox" id="only"> tylko klatki z błędami</label>
  <span id="summary">liczę…</span>
</header>
<main id="list"></main>
<script type="module" src="./wardrobeReview.ts"></script>
</body>
</html>
